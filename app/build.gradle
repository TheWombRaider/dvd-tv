plugins {
    id 'com.android.application'
}

def referenceDirectory = rootProject.file('docs/reference')
def generatedPalette = layout.buildDirectory.dir('generated/source/palette')
def generatedFixtures = layout.buildDirectory.dir('generated/resources/reference')

def generatePalette = tasks.register('generatePalette') {
    inputs.file(new File(referenceDirectory, 'palette.json'))
    outputs.dir(generatedPalette)
    doLast {
        def palette = new groovy.json.JsonSlurper().parse(inputs.files.singleFile).colors
        if (!palette || palette.any { it.size() != 3 || it.any { c -> !(c instanceof Number) || c != c.intValue() || c < 0 || c > 255 } }) {
            throw new GradleException('Reference palette must contain RGB byte triples')
        }
        def colors = palette.collect { rgb -> String.format('0xff%02x%02x%02x', *rgb) }.join(',\n        ')
        def output = new File(generatedPalette.get().asFile, 'io/github/thewombraider/dvdtv/MeasuredPalette.java')
        output.parentFile.mkdirs()
        output.setText("""package io.github.thewombraider.dvdtv;

// Generated from docs/reference/palette.json. Do not edit this file.
final class MeasuredPalette {
    static final int[] COLORS = {
        ${colors}
    };

    private MeasuredPalette() {}
}
""", 'UTF-8')
    }
}

def generateReferenceFixtures = tasks.register('generateReferenceFixtures') {
    inputs.file(new File(referenceDirectory, 'measurements.json'))
    outputs.dir(generatedFixtures)
    doLast {
        def fixture = new groovy.json.JsonSlurper().parse(inputs.files.singleFile)
        def output = new File(generatedFixtures.get().asFile, 'reference-samples.tsv')
        output.parentFile.mkdirs()
        output.setText(fixture.samples.collect { sample ->
            ([sample.frame, sample.split] + sample.bbox + sample.rgb + [sample.positionErrorPx ?: 0]).join('\t')
        }.join('\n') + '\n', 'UTF-8')
        def diagnostics = new File(generatedFixtures.get().asFile, 'reference-diagnostics.tsv')
        diagnostics.setText((fixture.excludedSamples ?: []).collect { sample ->
            ([sample.frame] + sample.bbox + [sample.positionErrorPx]).join('\t')
        }.join('\n') + '\n', 'UTF-8')
    }
}

android {
    namespace 'io.github.thewombraider.dvdtv'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.thewombraider.dvdtv'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    sourceSets {
        main.java.srcDir generatedPalette
        test.resources.srcDir generatedFixtures
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // The local sideload build follows the reference project's debug signing convention.
            signingConfig signingConfigs.debug
        }
    }

    lint {
        // SDK 34 matches the installed, offline reference-project toolchain.
        disable 'OldTargetApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.named('preBuild').configure { dependsOn generatePalette }
tasks.withType(Test).configureEach {
    dependsOn generateReferenceFixtures
    systemProperty 'app.sourceDirectory', projectDir.absolutePath
}
tasks.matching { it.name.endsWith('UnitTestJavaRes') }.configureEach {
    dependsOn generateReferenceFixtures
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
